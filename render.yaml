services:
  - type: web
    name: cashnote-website
    runtime: static
    buildCommand: echo "CashNote website is ready to publish"
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800

  - type: web
    name: cashnote-download-api
    runtime: node
    rootDir: api
    plan: starter
    disk:
      name: cashnote-site-content
      mountPath: /var/data
      sizeGB: 1
    buildCommand: echo "CashNote download gateway uses Node.js built-ins only"
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GITHUB_OWNER
        value: Muhammad5231
      - key: GITHUB_REPO
        value: CashNote-Releases
      - key: STATS_CACHE_SECONDS
        value: 180
      - key: SITE_URL
        value: https://cashnote-website.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://cashnote-website.onrender.com,http://localhost:8080
      - key: PUBLIC_API_URL
        value: https://cashnote-download-api.onrender.com
      - key: CASHNOTE_DATA_DIR
        value: /var/data/cashnote-site
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
